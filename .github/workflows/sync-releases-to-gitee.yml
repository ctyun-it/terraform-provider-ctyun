name: Sync Releases to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Sync all releases (not just the triggered one)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases to Gitee
        env:
          GH_REPO: ctyun-it/terraform-provider-ctyun
          GITEE_REPO: ctyun-provider/terraform-provider-ctyun
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_ALL: ${{ github.event.inputs.sync_all }}
          TRIGGER_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request, urllib.error, tempfile, shutil

          GH_REPO = os.environ["GH_REPO"]
          GITEE_REPO = os.environ["GITEE_REPO"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          SYNC_ALL = os.environ.get("SYNC_ALL", "false")
          TRIGGER_TAG = os.environ.get("TRIGGER_TAG", "")

          def gh_api(path):
              req = urllib.request.Request(f"https://api.github.com{path}",
                  headers={"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def gitee_api(path, data=None, files=None):
              url = f"https://gitee.com/api/v5{path}?access_token={GITEE_TOKEN}"
              if files:
                  boundary = "----PythonBoundary" + os.urandom(8).hex()
                  body = b""
                  for key, val in data.items():
                      body += f"--{boundary}\r\n".encode()
                      body += f'Content-Disposition: form-data; name="{key}"\r\n\r\n{val}\r\n'.encode()
                  for key, filename, content in files:
                      body += f"--{boundary}\r\n".encode()
                      body += f'Content-Disposition: form-data; name="{key}"; filename="{filename}"\r\n'.encode()
                      body += b"Content-Type: application/octet-stream\r\n\r\n"
                      body += content + b"\r\n"
                  body += f"--{boundary}--\r\n".encode()
                  req = urllib.request.Request(url, data=body, method="POST",
                      headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
              elif data:
                  body = json.dumps(data)
                  req = urllib.request.Request(url, data=body.encode(), method="POST",
                      headers={"Content-Type": "application/json"})
              else:
                  req = urllib.request.Request(url)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  print(f"  Gitee API error {e.code}: {err}")
                  return None

          existing = set()
          page = 1
          while True:
              rels = gitee_api(f"/repos/{GITEE_REPO}/releases", data=None)
              if not rels:
                  break
              for r in rels:
                  existing.add(r.get("tag_name", ""))
              if len(rels) < 100:
                  break
              page += 1

          print(f"Found {len(existing)} releases on Gitee")

          if SYNC_ALL == "true":
              tags = []
              page = 1
              while True:
                  rels = gh_api(f"/repos/{GH_REPO}/releases?per_page=100&page={page}")
                  if not rels:
                      break
                  tags.extend(r["tag_name"] for r in rels)
                  page += 1
          elif TRIGGER_TAG:
              tags = [TRIGGER_TAG]
          else:
              rels = gh_api(f"/repos/{GH_REPO}/releases?per_page=1")
              tags = [rels[0]["tag_name"]] if rels else []

          if not tags:
              print("No releases to sync")
              sys.exit(0)

          synced = 0
          skipped = 0
          failed = 0

          for tag in tags:
              if tag in existing:
                  print(f"[SKIP] {tag} already on Gitee")
                  skipped += 1
                  continue

              print(f"[SYNC] {tag}")

              try:
                  rel = gh_api(f"/repos/{GH_REPO}/releases/tags/{tag}")
              except Exception as e:
                  print(f"  [ERROR] GitHub fetch failed: {e}")
                  failed += 1
                  continue

              body = rel.get("body") or ""
              if not body.strip():
                  body = "See GitHub release for details"
              target = rel.get("target_commitish") or "main"

              print(f"  body length={len(body)}, target_commitish={target}")

              new_rel = gitee_api(f"/repos/{GITEE_REPO}/releases", data={
                  "tag_name": tag,
                  "name": rel.get("name") or tag,
                  "body": body,
                  "target_commitish": target,
                  "prerelease": rel.get("prerelease", False),
              })

              if not new_rel or not new_rel.get("id"):
                  print(f"  [ERROR] Failed to create release for {tag}")
                  failed += 1
                  continue

              gitee_id = new_rel["id"]
              print(f"  Created Gitee release id={gitee_id}")

              tmp = tempfile.mkdtemp()
              try:
                  for asset in rel.get("assets", []):
                      name = asset["name"]
                      print(f"  Downloading {name} ...")
                      try:
                          req = urllib.request.Request(asset["url"],
                              headers={"Authorization": f"token {GH_TOKEN}", "Accept": "application/octet-stream"})
                          with urllib.request.urlopen(req) as r:
                              content = r.read()
                      except Exception:
                          with urllib.request.urlopen(asset["browser_download_url"]) as r:
                              content = r.read()

                      print(f"  Uploading {name} ({len(content)//1024} KB) ...")
                      result = gitee_api(f"/repos/{GITEE_REPO}/releases/{gitee_id}/attach_files",
                          data={}, files=[("file", name, content)])
                      if result:
                          print(f"  Uploaded: {result.get(\"name\", name)}")
                      else:
                          print(f"  [WARN] Upload may have failed for {name}")
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)

              print(f"[DONE] {tag}")
              synced += 1

          print(f"\nSync complete: synced={synced} skipped={skipped} failed={failed}")
          if failed > 0:
              sys.exit(1)
          '
