name: Sync Releases to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Sync all releases (not just the triggered one)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases to Gitee
        env:
          GH_REPO: ctyun-it/terraform-provider-ctyun
          GITEE_REPO: ctyun-provider/terraform-provider-ctyun
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_ALL: ${{ github.event.inputs.sync_all }}
          TRIGGER_TAG: ${{ github.event.release.tag_name }}
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import os, sys, requests, tempfile, shutil

          GH_REPO = os.environ["GH_REPO"]
          GITEE_REPO = os.environ["GITEE_REPO"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          SYNC_ALL = os.environ.get("SYNC_ALL", "false")
          TRIGGER_TAG = os.environ.get("TRIGGER_TAG", "")

          GH_HEADERS = {"Authorization": "token " + GH_TOKEN, "Accept": "application/vnd.github+json"}
          GITEE_PARAMS = {"access_token": GITEE_TOKEN}

          def log(msg):
              print(msg, flush=True)

          def gh_get(path):
              r = requests.get("https://api.github.com" + path, headers=GH_HEADERS, timeout=30)
              r.raise_for_status()
              return r.json()

          def gitee_get(path, params=None):
              p = dict(GITEE_PARAMS)
              if params:
                  p.update(params)
              r = requests.get("https://gitee.com/api/v5" + path, params=p, timeout=30)
              if r.status_code != 200:
                  log("  Gitee GET error " + str(r.status_code) + ": " + r.text)
                  return None
              return r.json()

          def gitee_post_json(path, data):
              p = dict(GITEE_PARAMS)
              r = requests.post("https://gitee.com/api/v5" + path, params=p, json=data, timeout=30)
              if r.status_code not in (200, 201):
                  log("  Gitee POST error " + str(r.status_code) + ": " + r.text)
                  return None
              return r.json()

          def gitee_post_file(path, file_path, file_name):
              p = dict(GITEE_PARAMS)
              with open(file_path, "rb") as f:
                  r = requests.post("https://gitee.com/api/v5" + path, params=p,
                      files={"file": (file_name, f, "application/octet-stream")}, timeout=120)
              if r.status_code not in (200, 201):
                  log("  Gitee upload error " + str(r.status_code) + ": " + r.text)
                  return None
              return r.json()

          log("=== Querying existing Gitee releases ===")
          existing = set()
          page = 1
          while True:
              rels = gitee_get("/repos/" + GITEE_REPO + "/releases", {"page": page, "per_page": 100})
              if not rels:
                  break
              for r in rels:
                  existing.add(r.get("tag_name", ""))
              log("  page " + str(page) + ": " + str(len(rels)) + " releases")
              if len(rels) < 100:
                  break
              page += 1

          log("Found " + str(len(existing)) + " releases on Gitee")

          if SYNC_ALL == "true":
              log("=== Fetching all GitHub releases ===")
              tags = []
              page = 1
              while True:
                  rels = gh_get("/repos/" + GH_REPO + "/releases?per_page=100&page=" + str(page))
                  if not rels:
                      break
                  tags.extend(r["tag_name"] for r in rels)
                  log("  page " + str(page) + ": " + str(len(rels)) + " releases")
                  page += 1
          elif TRIGGER_TAG:
              tags = [TRIGGER_TAG]
          else:
              rels = gh_get("/repos/" + GH_REPO + "/releases?per_page=1")
              tags = [rels[0]["tag_name"]] if rels else []

          if not tags:
              log("No releases to sync")
              sys.exit(0)

          log("Releases to sync: " + str(tags))

          synced = 0
          skipped = 0
          failed = 0
          tmp = tempfile.mkdtemp()

          try:
              for tag in tags:
                  log("")
                  log("--- Processing " + tag + " ---")

                  if tag in existing:
                      log("[SKIP] " + tag + " already on Gitee")
                      skipped += 1
                      continue

                  try:
                      rel = gh_get("/repos/" + GH_REPO + "/releases/tags/" + tag)
                  except Exception as e:
                      log("[ERROR] GitHub fetch failed: " + str(e))
                      failed += 1
                      continue

                  body = rel.get("body") or ""
                  if not body.strip():
                      body = "See GitHub release for details"
                  target = rel.get("target_commitish") or "main"
                  rel_name = rel.get("name") or tag
                  is_prerelease = rel.get("prerelease", False)

                  log("  body length=" + str(len(body)) + ", target=" + target)

                  new_rel = gitee_post_json("/repos/" + GITEE_REPO + "/releases", {
                      "tag_name": tag,
                      "name": rel_name,
                      "body": body,
                      "target_commitish": target,
                      "prerelease": is_prerelease,
                  })

                  if not new_rel or not new_rel.get("id"):
                      log("[ERROR] Failed to create release for " + tag)
                      failed += 1
                      continue

                  gitee_id = new_rel["id"]
                  log("  Created Gitee release id=" + str(gitee_id))

                  assets = rel.get("assets", [])
                  log("  Found " + str(len(assets)) + " assets")

                  for asset in assets:
                      name = asset["name"]
                      size = asset.get("size", 0)
                      log("  Downloading " + name + " (" + str(size // 1024) + " KB) ...")

                      file_path = os.path.join(tmp, tag + "_" + name)
                      downloaded = False

                      try:
                          r = requests.get(asset["url"], headers=GH_HEADERS, timeout=120, stream=True)
                          r.raise_for_status()
                          with open(file_path, "wb") as f:
                              for chunk in r.iter_content(8192):
                                  f.write(chunk)
                          downloaded = True
                      except Exception as e:
                          log("    API download failed: " + str(e))

                      if not downloaded:
                          try:
                              r = requests.get(asset["browser_download_url"], timeout=120, stream=True)
                              r.raise_for_status()
                              with open(file_path, "wb") as f:
                                  for chunk in r.iter_content(8192):
                                      f.write(chunk)
                              downloaded = True
                          except Exception as e:
                              log("    browser download failed: " + str(e))

                      if not downloaded or not os.path.exists(file_path):
                          log("  [WARN] Failed to download " + name + ", skipping")
                          continue

                      log("  Uploading " + name + " ...")
                      result = gitee_post_file(
                          "/repos/" + GITEE_REPO + "/releases/" + str(gitee_id) + "/attach_files",
                          file_path, name
                      )
                      if result:
                          log("  Uploaded: " + result.get("name", name))
                      else:
                          log("  [WARN] Upload may have failed for " + name)

                      try:
                          os.remove(file_path)
                      except:
                          pass

                  log("[DONE] " + tag)
                  synced += 1
          finally:
              shutil.rmtree(tmp, ignore_errors=True)

          log("")
          log("=== Sync complete: synced=" + str(synced) + " skipped=" + str(skipped) + " failed=" + str(failed) + " ===")
          if failed > 0:
              sys.exit(1)
          PYEOF
